[workspace]
resolver = "2"
members = ["crates/ds-proto", "crates/dsz"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# eframe 0.32.3 with one fix: it busy-polls for a repaint of a hidden window,
# which never comes, so the app used a full core while in the tray. See
# `check_redraw_requests` in vendor/eframe/src/native/run.rs.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
