[package]
name = "dsz"
description = "Fast, native DualSense / DualSense Edge companion: lighting, adaptive triggers, wireless haptics, gyro and touchpad mouse, profiles"
edition.workspace = true
version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "dsz"
path = "src/main.rs"

[dependencies]
ds-proto = { path = "../ds-proto" }
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = { version = "0.4", features = ["std"] }
cpal = "0.15"
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Bluetooth",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_System_Com_Urlmon",
    "Win32_Media",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
]
